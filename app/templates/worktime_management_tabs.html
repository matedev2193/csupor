<nav class="worktime-tabs" aria-label="{{ _('Working-time management') }}">
  {% if can_access_endpoint('worktime.management') %}
  <a class="worktime-tab{% if request.endpoint == 'worktime.management' %} active{% endif %}" href="{{ url_for('worktime.management', place_id=selected_place_id, year=selected_year, month=selected_month, user_id=selected_user_id|default('')) }}"{% if request.endpoint == 'worktime.management' %} aria-current="page"{% endif %}>{{ _('Schedules and records') }}</a>
  {% endif %}
  {% if can_access_endpoint('worktime.groups') %}
  <a class="worktime-tab{% if request.endpoint == 'worktime.groups' %} active{% endif %}" href="{{ url_for('worktime.groups', place_id=selected_place_id) }}"{% if request.endpoint == 'worktime.groups' %} aria-current="page"{% endif %}>{{ _('Groups') }}</a>
  {% endif %}
</nav>
