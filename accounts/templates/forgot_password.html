{% extends "base.html" %}
{% block title %}Elfelejtett jelszó · Micimackó-fiók{% endblock %}
{% block content %}
<span class="eyebrow">Segítünk visszajutni</span>
<h2 id="page-title">Elfelejtetted a jelszavad?</h2>
<p class="lead">Add meg a fiókod e-mail-címét. Elküldjük az új jelszó beállításához szükséges hivatkozást.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">E-mail-cím</label>
  <input id="email" name="email" type="email" autocomplete="email" maxlength="120" required autofocus>
  <button type="submit">Hivatkozás küldése</button>
</form>
<p class="form-footer"><a href="{{ url_for('web.login') }}">Vissza a bejelentkezéshez</a></p>
{% endblock %}
